name: Build installers

# Produces the real, installable artifacts:
#   Windows -> Graphene-<ver>-win-x64.exe (NSIS installer) + portable .exe
#   Linux   -> Graphene-<ver>-linux-x86_64.AppImage + .deb
#   macOS   -> Graphene-<ver>-mac-x64.dmg and -arm64.dmg
#
# These cannot be built in the dev sandbox: electron-builder must download the
# Electron runtime from objects.githubusercontent.com, which is blocked there.
# GitHub's own runners have no such restriction, and macOS needs a Mac anyway.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # lets you build on demand from the Actions tab

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci --ignore-scripts
      - name: Run the full suite
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: graphene-windows
          - os: ubuntu-latest
            target: --linux
            artifact: graphene-linux
          - os: macos-latest
            target: --mac
            artifact: graphene-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }

      - name: Install dependencies
        run: npm ci

      # Signing is optional: with the secrets present the build is signed with
      # com.n_o_group.graphene, without them it still produces working
      # (unsigned) installers, so forks and PRs are not blocked.
      - name: Report signing status
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "Signing with the com.n_o_group.graphene keystore."
          else
            echo "::warning::CSC_LINK is not set - producing UNSIGNED installers."
            echo "Add CSC_LINK and CSC_KEY_PASSWORD under Settings > Secrets > Actions to sign."
          fi

      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both are empty when the secrets are absent, which electron-builder
          # treats as "do not sign" rather than as an error.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # stop macOS hunting for a keychain identity that is not installed
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: Checksums for every artifact
        shell: bash
        run: |
          cd dist
          for f in *.exe *.AppImage *.deb *.dmg *.zip; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done | tee SHA256SUMS.txt

      - name: Show what was produced
        shell: bash
        run: ls -lah dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/SHA256SUMS.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
