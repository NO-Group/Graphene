name: Build installers

# Produces the real, installable artifacts:
#   Windows -> Graphene-<ver>-win-x64.exe (NSIS installer) + portable .exe
#   Linux   -> Graphene-<ver>-linux-x86_64.AppImage + .deb
#   macOS   -> Graphene-<ver>-mac-x64.dmg and -arm64.dmg
#
# These cannot be built in the dev sandbox: electron-builder must download the
# Electron runtime from objects.githubusercontent.com, which is blocked there.
# GitHub's own runners have no such restriction, and macOS needs a Mac anyway.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # lets you build on demand from the Actions tab

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci --ignore-scripts
      - name: Run the full suite
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: graphene-windows
          - os: ubuntu-latest
            target: --linux
            artifact: graphene-linux
          - os: macos-latest
            target: --mac
            artifact: graphene-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned builds: CSC_IDENTITY_AUTO_DISCOVERY off stops macOS from
          # trying to sign with a certificate that is not present
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Show what was produced
        shell: bash
        run: ls -lah dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
